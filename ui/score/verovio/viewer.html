<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <link rel="stylesheet" href="./viewer.css" />

    <script>
      // must be defined before loading verovio-toolkit-wasm.js
      var Module = {
        locateFile: function(path, prefix) {
          // viewer.html lives in: ui/score/verovio/
          // wasm lives in:        ui/score/verovio/imports
          return "./imports/" + path;
        }
      };
    </script>
    <!-- local verovio WASM loader -->
    <script src="./imports/verovio-toolkit-wasm.js"></script>

    <!-- Qt WebChannel (JS->Python push bridge; baked into QtWebEngine).
         Missing outside the Qt app (plain browser / node test) - viewer.js
         guards on QWebChannel being undefined. -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>

    <!-- app code -->
    <script src="./viewer.js"></script>
  </head>

  <body>
    <div id="wrap"><div id="notation"></div></div>
  </body>
</html>
